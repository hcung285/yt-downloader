[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ytdl"
version = "0.1.0"
description = "Download YouTube videos and playlists (incl. private/unlisted via your logged-in browser) to a folder."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp",
    "platformdirs>=4",
    "typer>=0.12",
    "rich>=13",
    "imageio-ffmpeg>=0.5",  # bundled ffmpeg fallback when none is on PATH
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
ytdl = "ytdl.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["ytdl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
